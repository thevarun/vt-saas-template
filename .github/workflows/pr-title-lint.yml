# Lints the PULL REQUEST TITLE against Conventional Commits.
#
# WHY THIS EXISTS (and is separate from CI.yml's commitlint step):
# We merge with SQUASH, and the squash commit title is set to the PR title
# (see /init-downstream → Configure GitHub Repo). semantic-release then reads
# that squashed commit to decide the version bump + changelog entry. CI.yml's
# commitlint validates the branch's individual commits — which squash DISCARDS —
# so it does NOT protect the one message that actually lands on main. This does.
name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Dependabot PR titles are already conventional; skip to avoid noise.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
