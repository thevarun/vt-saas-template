name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Detect Changes (denylist approach)
  # ============================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
      deps_only: ${{ steps.filter.outputs.deps_only }}
      is_dependabot: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v6

      # Denylist approach: Define what counts as "docs only" or "deps only".
      # The flag is true ONLY when ALL changed files match the pattern (not just
      # "any"), so any file outside these patterns triggers full CI — safer,
      # since new files trigger CI by default.
      #
      # Each filter is a SINGLE brace-glob alternation matched with the `every`
      # quantifier ("every changed file matches this one pattern"). A *multi-entry*
      # list under `every` is an AND across patterns — no single file can match
      # `*.md` AND `docs/**` AND `LICENSE` at once — so docs_only/deps_only were
      # always false and full CI (E2E + Vercel preview) ran on every docs-only PR.
      # Keep this as a job-level skip (downstream `if:`), never a trigger-level
      # `paths-ignore`: a skipped job reports success to branch protection,
      # whereas an un-triggered required check stays Pending and blocks the PR.
      #
      # deps_only: lockfile/manifest-only PRs (e.g. Dependabot bumps).
      # Build + Lint + Types + Unit still run (catch typing/runtime fallout).
      # E2E is skipped — runtime fallout in deps shows up in unit tests
      # or build, and Vercel Preview deploys provide a smoke gate too.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            docs_only:
              - '{*.md,docs/**,_bmad-output/**,.github/*.md,.github/ISSUE_TEMPLATE/**,.github/PULL_REQUEST_TEMPLATE/**,.vscode/**,LICENSE,.editorconfig}'
            deps_only:
              - '{package.json,package-lock.json,.github/dependabot.yml}'

  # ============================================
  # Install & Build (shared by downstream jobs)
  # ============================================
  install:
    name: Install & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --prefer-offline --no-audit --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          DB_SCHEMA: vt_saas
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY || 'test-placeholder-key' }}
          DIFY_API_URL: ${{ secrets.DIFY_API_URL || 'https://api.dify.ai/v1' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

      # Cache node_modules and build output for downstream jobs
      - uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            .next
          key: build-${{ github.sha }}

  # ============================================
  # Lint & Type Check
  # ============================================
  lint:
    name: Lint & Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, install]
    if: needs.changes.outputs.docs_only != 'true'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            .next
          key: build-${{ github.sha }}

      - name: Validate commits (PR only, skip Dependabot)
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - run: npm run lint
      - run: npm run check-types

  # ============================================
  # Unit Tests (skip for docs-only changes)
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, install]
    if: needs.changes.outputs.docs_only != 'true'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            .next
          key: build-${{ github.sha }}

      # Dependabot PRs don't have access to secrets, use placeholders
      # Integration tests requiring real credentials are skipped via test config
      - run: npm run test -- --coverage
        env:
          DB_SCHEMA: vt_saas
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY || 'test-placeholder-key' }}
          DIFY_API_URL: ${{ secrets.DIFY_API_URL || 'https://api.dify.ai/v1' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

  # ============================================
  # E2E Tests
  # Skipped for: docs-only changes, deps-only changes, and Dependabot PRs.
  # - Docs-only: nothing to E2E.
  # - Deps-only: build + types + unit cover dep fallout; Vercel Preview
  #   acts as the runtime smoke gate. Saves ~5 min per dep PR.
  # - Dependabot: no access to repo secrets, so E2E couldn't run anyway.
  # ============================================
  e2e:
    name: Build & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, install]
    if: |
      needs.changes.outputs.docs_only != 'true'
      && needs.changes.outputs.deps_only != 'true'
      && needs.changes.outputs.is_dependabot != 'true'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            .next
          key: build-${{ github.sha }}

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          DB_SCHEMA: vt_saas
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
          DIFY_API_URL: ${{ secrets.DIFY_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
