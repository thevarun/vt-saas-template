name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Detect Changes (fail-safe positive "code" signal)
  # ============================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      # dorny/paths-filter is OR-across-files (a filter is true if ANY changed
      # file matches); it has no "every changed file matches" mode. So instead of
      # a docs_only denylist (which flips true off a SINGLE doc file and skips CI
      # on PRs that mix docs + code), we detect the fail-safe POSITIVE signal
      # `code` ("at least one non-docs file changed") and derive the rest from it.
      # Anything matching NEITHER denylist (incl. brand-new paths) → code=true → CI runs.
      docs_only: ${{ steps.filter.outputs.code != 'true' }}
      deps_only: ${{ steps.filter.outputs.code == 'true' && steps.filter.outputs.non_deps_code != 'true' }}
      is_dependabot: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v7

      # WHY THE INVERSION: `predicate-quantifier: every` is a PER-FILE pattern
      # combinator (one file must match every pattern), NOT a cross-file "all
      # files match" quantifier — dorny always ORs across files (output = true if
      # >=1 file matches). A denylist `docs_only` therefore went true off one doc
      # file and skipped Lint/Types/Unit/Build on code PRs. So we ask the inverse:
      #   code           = "a non-docs file changed"          (** minus the doc globs)
      #   non_deps_code  = "a non-docs, non-deps file changed" (also minus manifests)
      # Here `every` IS meaningful: each file must match `**` AND none of the
      # negations. Job-level skip (downstream `if:`), never a trigger-level
      # `paths-ignore`: a skipped job reports success to branch protection,
      # whereas an un-triggered required check stays Pending and blocks the PR.
      # (deps_only still skips only E2E; build/lint/types/unit run on dep bumps.)
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!docs/**'
              - '!_bmad-output/**'
              - '!.github/*.md'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/PULL_REQUEST_TEMPLATE/**'
              - '!.vscode/**'
              - '!LICENSE'
              - '!.editorconfig'
            non_deps_code:
              - '**'
              - '!*.md'
              - '!docs/**'
              - '!_bmad-output/**'
              - '!.github/*.md'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/PULL_REQUEST_TEMPLATE/**'
              - '!.vscode/**'
              - '!LICENSE'
              - '!.editorconfig'
              - '!package.json'
              - '!package-lock.json'
              - '!.github/dependabot.yml'

  # ============================================
  # Install & Build (shared by downstream jobs)
  # ============================================
  install:
    name: Install & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --prefer-offline --no-audit --legacy-peer-deps

      # Audit only production (runtime) dependencies at high+ severity. Dev-only
      # chains (Storybook, Commitizen, etc.) can carry CVEs that never ship to the
      # production runtime, so `--omit=dev` keeps the signal on what actually
      # deploys. Fails the job on high/critical runtime vulns; lower severities pass.
      - name: Audit production dependencies
        # Advisory (non-blocking) until the pre-existing high-severity runtime
        # deps are remediated (dependabot handles mem0ai; see follow-ups). Flip
        # continue-on-error off once `npm audit --omit=dev --audit-level=high` is clean.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
        env:
          DB_SCHEMA: vt_saas
          NEXT_PUBLIC_DB_SCHEMA: vt_saas
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY || 'test-placeholder-key' }}
          DIFY_API_URL: ${{ secrets.DIFY_API_URL || 'https://api.dify.ai/v1' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

      # Cache node_modules and build output for downstream jobs
      - uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            .next
          key: build-${{ github.sha }}

  # ============================================
  # Lint & Type Check
  # ============================================
  lint:
    name: Lint & Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, install]
    if: needs.changes.outputs.docs_only != 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            .next
          key: build-${{ github.sha }}

      - name: Validate commits (PR only, skip Dependabot)
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - run: npm run lint
      - run: npm run check-types

  # ============================================
  # Unit Tests (skip for docs-only changes)
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, install]
    if: needs.changes.outputs.docs_only != 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            .next
          key: build-${{ github.sha }}

      # Dependabot PRs don't have access to secrets, use placeholders
      # Integration tests requiring real credentials are skipped via test config
      # No --coverage: the number was generated but never gated, so it only added
      # v8 instrumentation cost. Run `npm run test -- --coverage` locally on demand.
      - run: npm run test
        env:
          DB_SCHEMA: vt_saas
          NEXT_PUBLIC_DB_SCHEMA: vt_saas
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY || 'test-placeholder-key' }}
          DIFY_API_URL: ${{ secrets.DIFY_API_URL || 'https://api.dify.ai/v1' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

  # ============================================
  # E2E Tests
  # Skipped for: docs-only changes, deps-only changes, and Dependabot PRs.
  # - Docs-only: nothing to E2E.
  # - Deps-only: build + types + unit cover dep fallout; Vercel Preview
  #   acts as the runtime smoke gate. Saves ~5 min per dep PR.
  # - Dependabot: no access to repo secrets, so E2E couldn't run anyway.
  # ============================================
  e2e:
    name: Build & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, install]
    if: |
      needs.changes.outputs.docs_only != 'true'
      && needs.changes.outputs.deps_only != 'true'
      && needs.changes.outputs.is_dependabot != 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            .next
          key: build-${{ github.sha }}

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          DB_SCHEMA: vt_saas
          NEXT_PUBLIC_DB_SCHEMA: vt_saas
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
          DIFY_API_URL: ${{ secrets.DIFY_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  # ============================================
  # Storybook — run the shared UI catalog as Vitest browser tests
  # `test:stories` renders every *.stories.tsx in headless Chromium via the
  # Storybook Vitest addon, so a broken import, a render error, or a failing play
  # function fails CI. Needs no secrets (env placeholders are set in
  # vitest.config.mts), so unlike E2E it also runs on Dependabot PRs to catch
  # dependency-driven breakage. Skipped only for docs-only changes.
  # ============================================
  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, install]
    if: needs.changes.outputs.docs_only != 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            .next
          key: build-${{ github.sha }}

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run story tests
        run: npm run test:stories

  # ============================================
  # CI Gate — aggregate status check (additive)
  # ============================================
  # Additive rollup: the three required contexts ("Lint & Types", "Unit Tests",
  # "Build & E2E") still run and report unchanged. This extra job `if: always()`
  # runs and aggregates every needed job's result — green when they all passed OR
  # were legitimately skipped (docs-only / deps-only PR), red when any actually
  # failed or was cancelled. It reports `CI Gate` on EVERY PR, so it can become
  # the SINGLE required context: docs-only PRs skip the real jobs but `CI Gate`
  # still reports success. NOTE: a workflow file cannot change branch protection —
  # after this merges, a maintainer must swap the required contexts on `main` to
  # ONLY "CI Gate" (see the commit body). Keep this `name:` in sync with that
  # required-check context.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [changes, install, lint, unit-tests, e2e, storybook]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require no upstream failure
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e "const n=JSON.parse(process.env.NEEDS);
            const bad=Object.entries(n).filter(([,v])=>!['success','skipped'].includes(v.result));
            if(bad.length){console.error('Failing jobs:',JSON.stringify(bad));process.exit(1)}
            console.log('All upstream jobs success or skipped.')"
